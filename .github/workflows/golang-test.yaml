on:
  workflow_call:
    inputs:
      go_version:
        type: string
        required: false
        default: 1.17
      run_static_check:
        type: boolean
        required: false
        default: true
      static_check_version:
        type: string
        required: false
        default: v0.3.3
      run_docker_login:
        type: boolean
        required: false
        default: true
      test_docker_compose_path:
        required: false
        type: string
      private_repos:
        description: "Comma-separated gamezop repo names to fetch private Go modules from (jinbe = gzp-common-go). Uses a 1-hour read-only gamezop-ci-deps App token instead of GITHUB_ACCESS_TOKEN. PLAT-2596"
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
      GITHUB_ACCESS_TOKEN:
        required: false
      GO_DEPS_APP_PRIVATE_KEY:
        description: "gamezop-ci-deps App private key; required with private_repos"
        required: false

env:
  GOPATH: ${{ github.workspace }}/go
  PROJECTPATH: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}
  GOPRIVATE: "github.com/gamezop,github.com/Gamezop"
jobs:
  test:
    runs-on: ubuntu-latest
    name: test
    defaults:
      run:
        working-directory: ./go/src/github.com/${{ github.repository }}
    steps:
      - name: setup go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ inputs.go_version }}
      - name: checkout ${{ github.repository }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
          path: ./go/src/github.com/${{ github.repository }}
      - name: Log in to Docker Hub
        if: ${{ inputs.test_docker_compose_path != '' && inputs.run_docker_login }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Stackup
        if: ${{ inputs.test_docker_compose_path != '' }}
        run: |
          docker compose -f "${{ inputs.test_docker_compose_path }}" up -d --build
        shell: bash
      - name: set up cache env paths
        id: go-cache-paths
        run: |
          echo "::set-output name=go-build::$(go env GOCACHE)"
          echo "::set-output name=go-mod::$(go env GOMODCACHE)"
          echo "::set-output name=go-bin::$GOPATH/bin"
      - name: Go Mod Cache
        id: golang-lib-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
      - name: Go bin Cache
        id: golang-bin-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache-paths.outputs.go-bin }}
          key: ${{ runner.os }}-go-bin-v1-${{ hashFiles('*') }} # change v1 to invalidate cache when adding bin
      # Cache go build cache, used to speedup go test
      - name: Go Build Cache
        id: golang-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
      # Strict check: a blank/comma-only list would make the App mint a token for every repo.
      - name: Validate private_repos
        if: ${{ inputs.private_repos != '' && steps.golang-lib-cache.outputs.cache-hit != 'true' }}
        env:
          REPOS: ${{ inputs.private_repos }}
        run: |
          [[ "$REPOS" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]] || { echo "::error::private_repos must be comma-separated repo names (no spaces), got: '$REPOS'"; exit 1; }
      - name: Mint read-only token for private repos
        id: deps_token
        if: ${{ inputs.private_repos != '' && steps.golang-lib-cache.outputs.cache-hit != 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: Iv23li9MIYyyUicJwmPx # gamezop-ci-deps (App ID 5903182)
          private-key: ${{ secrets.GO_DEPS_APP_PRIVATE_KEY }}
          owner: gamezop
          repositories: ${{ inputs.private_repos }}
          permission-contents: read
      - name: prepare golang-lib-cache
        if: steps.golang-lib-cache.outputs.cache-hit != 'true'
        env:
          APP_TOKEN: ${{ steps.deps_token.outputs.token }}
          GITHUB_ACCESS_TOKEN: ${{ inputs.private_repos == '' && secrets.GITHUB_ACCESS_TOKEN || '' }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            # Env-only rewrite for this step; nothing written to git config.
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${APP_TOKEN}@github.com/gamezop/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/gamezop/"
          else
            git config --global url."https://${GITHUB_ACCESS_TOKEN}:x-oauth-basic@github.com".insteadOf "https://github.com"
          fi
          go mod vendor
      - name: prepare golang-bin-cache
        if: steps.golang-bin-cache.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ inputs.static_check_version }}
        # staticcheck version v0.4.x doesn't work with go 1.17
        # alternative is golangci-lint
        # 💡 shows only a few annotations, if there are thousands
      # - name: revive
      #   uses: docker://morphy/revive-action:v2
      - name: static checker
        if: ${{ inputs.run_static_check }}
        run: |
          staticcheck ./...
      - name: make test
        run: |
          make test
      - name: Stop containers
        if: ${{ (failure() || success()) &&  inputs.test_docker_compose_path != '' }}
        run: |
          docker compose -f "${{ inputs.test_docker_compose_path }}" down
