on:
  workflow_call:
    inputs:
      test_docker_compose_path:
        required: false
        type: string
      flag_test_coverage:
        required: false
        type: boolean
      elixir_version:
        type: string
        required: false
        default: "1.13.4"
      otp_version:
        type: string
        required: false
        default: "26.0"
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      GITHUB_ACCESS_TOKEN:
        required: false
      # Read-only deploy key for gamezop/gzp-common-ex (base64, one line). Callers using it
      # must keep the plain HTTPS URL in mix.exs; git rewrites it to SSH below.
      GZP_COMMON_EX_DEPLOY_KEY_B64:
        required: false

env:
  MIX_ENV: test
  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}

jobs:
  build_test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.test_docker_compose_path != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Stackup
        if: ${{ inputs.test_docker_compose_path != '' }}
        run: |
          docker compose -f "${{ inputs.test_docker_compose_path }}" up -d --build
        shell: bash
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ inputs.elixir_version }} # Define the elixir version [required]
          otp-version: ${{ inputs.otp_version }} # Define the OTP version [required]
          # experimental-otp: true
      - name: Configure gzp-common-ex deploy key
        env:
          KEY_B64: ${{ secrets.GZP_COMMON_EX_DEPLOY_KEY_B64 }}
        run: |
          [ -n "$KEY_B64" ] || exit 0
          install -d -m 700 ~/.ssh
          echo "$KEY_B64" | base64 -d > ~/.ssh/gzp_common_ex
          chmod 600 ~/.ssh/gzp_common_ex
          git config --global core.sshCommand "ssh -i ~/.ssh/gzp_common_ex -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gamezop/gzp-common-ex".insteadOf "https://github.com/gamezop/gzp-common-ex"
      - name: Retrieve Mix dependencies Cache
        uses: actions/cache@v3
        id: mix-cache
        with:
          path: deps
          key: $MIX_ENV-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}-${{ hashFiles(format('{0}{1}', github.workspace, '/config/test.exs')) }}-v8
      - name: Retrieve Mix build Cache
        uses: actions/cache@v3
        id: build-cache
        with:
          path: _build/test/
          key: $MIX_ENV-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}-${{ hashFiles(format('{0}{1}', github.workspace, '/config/test.exs')) }}-v8
      - name: Get dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Install dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          mix deps.compile
      - name: Reconcile deps
        run: |
          mix deps.get
          rm -f ~/.ssh/gzp_common_ex # last fetch; keep the key away from credo/tests
      - name: Check Formatting
        run: mix format --check-formatted
      - name: Check Credo
        run: mix credo
      - name: Run Tests
        run: |
          mix test
      - name: Test Coverage
        if: ${{ inputs.flag_test_coverage }}
        run: mix test --cover
      - name: Stop containers
        if: ${{ (failure() || success()) &&  inputs.test_docker_compose_path != '' }}
        run: |
          docker compose -f "${{ inputs.test_docker_compose_path }}" down
